<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ogra Boys Hostel - Digital Resident & Management Portal</title>
  
  <meta name="theme-color" content="#4338ca">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ogra Hostel">
  <link rel="manifest" href="manifest.json">
  
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Plus Jakarta Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex justify-center selection:bg-brand-500 selection:text-white pb-20 md:pb-6">

  <!-- App Opening Splash Screen -->
  <div id="splash-screen" class="fixed inset-0 z-50 bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 flex flex-col items-center justify-center text-white transition-opacity duration-700 ease-out">
    <div class="flex flex-col items-center text-center px-6">
      <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-indigo-700 p-0.5 shadow-2xl mb-5 pulse-emblem flex items-center justify-center">
        <div class="w-full h-full bg-slate-950/80 rounded-3xl backdrop-blur-sm flex items-center justify-center border border-white/20">
          <svg viewBox="0 0 64 64" fill="none" class="w-14 h-14" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 4L8 14V30C8 44.5 18.2 57.8 32 61C45.8 57.8 56 44.5 56 30V14L32 4Z" fill="url(#splashEmblemGrad)" stroke="#818cf8" stroke-width="2"/>
            <path d="M22 42V24H42V42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M18 46H46" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M32 20V26" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M27 33H37" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            <defs>
              <linearGradient id="splashEmblemGrad" x1="8" y1="4" x2="56" y2="61" gradientUnits="userSpaceOnUse">
                <stop stop-color="#312e81"/>
                <stop offset="1" stop-color="#1e1b4b"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>

      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 text-[11px] font-bold uppercase tracking-wider mb-2">
        <i class="ph-bold ph-shield-check"></i> Residence Portal
      </div>
      <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white">Ogra Boys Hostel</h1>
      <p class="text-xs sm:text-sm text-indigo-200/80 mt-1 font-medium">Real-Time Resident & Discipline Management</p>

      <div id="splash-status" class="mt-8 flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></div>
        <span class="text-[11px] uppercase tracking-widest text-slate-400 font-bold">Synchronizing Live Database</span>
      </div>
    </div>
  </div>

  <!-- Mobile App Frame -->
  <div id="app" class="w-full max-w-lg min-h-screen bg-slate-50 flex flex-col shadow-2xl relative border-x border-slate-200">
    
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 transform transition-all duration-300 opacity-0 pointer-events-none scale-95 w-11/12 max-w-md">
      <div id="toast-inner" class="flex items-center gap-3 p-3.5 rounded-2xl shadow-xl text-white text-sm font-semibold backdrop-blur-md bg-slate-900">
        <i id="toast-icon" class="ph-bold ph-info text-xl"></i>
        <span id="toast-msg" class="flex-1">Notification message</span>
      </div>
    </div>

    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/80 px-4 py-3 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
          <svg viewBox="0 0 64 64" fill="none" class="w-6 h-6" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 6L12 15V29C12 41.5 20.6 52.8 32 56C43.4 52.8 52 41.5 52 29V15L32 6Z" fill="#312e81" stroke="#ffffff" stroke-width="2.5"/>
            <path d="M24 38V24H40V38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M21 42H43" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-extrabold text-slate-900 leading-tight">Ogra Boys Hostel</h1>
            <span id="live-indicator" class="w-2 h-2 rounded-full bg-emerald-500" title="Connected Live"></span>
          </div>
          <p id="header-subtitle" class="text-xs font-semibold text-slate-400">Digital Residence System</p>
        </div>
      </div>

      <div id="header-actions" class="flex items-center gap-2"></div>
    </header>

    <main id="main-content" class="flex-1 p-4 overflow-y-auto">
    </main>

    <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-lg bg-white/95 backdrop-blur-md border-t border-slate-200 px-1 py-1.5 z-40 flex justify-around items-center shadow-lg transition-transform duration-300 hidden">
    </nav>
  </div>

  <script type="module" src="app.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registered successfully!', reg))
        .catch(err => console.error('Service Worker registration failed:', err));
    });
  }
  </script>
  
</body>
</html>
